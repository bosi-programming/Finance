name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Vitest unit & integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check pre-commit hook runs tests
        run: node -e "const h=require('./package.json')['simple-git-hooks']['pre-commit'];if(!h.includes('pnpm test:run')){console.error('pre-commit hook must run pnpm test:run');process.exit(1)}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit & integration tests
        run: pnpm test:run
